<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self' 'unsafe-inline'; img-src 'self'; font-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="robots" content="noindex">
<title>Страница не найдена — zabukai</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="stylesheet" href="/fonts/fonts.css">
<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#F8F5EE;color:#0D0D0D;font:400 16px/1.6 Manrope,system-ui,sans-serif;padding:24px 16px}
  main{max-width:520px}
  .code{font:900 clamp(72px,18vw,128px)/1 Tektur,"Arial Black",sans-serif;letter-spacing:.02em;margin:0;color:#0D0D0D}
  .code span{color:#EA5A24}
  h1{font:800 clamp(24px,5vw,32px)/1.15 Tektur,"Arial Black",sans-serif;margin:16px 0 12px}
  p{margin:0 0 28px;color:#4B4B4B}
  .row{display:flex;flex-wrap:wrap;gap:12px}
  a{display:inline-flex;align-items:center;font:700 14px/1 Manrope,system-ui,sans-serif;color:#0D0D0D;text-decoration:none;padding:14px 18px;border:2px solid #0D0D0D;border-radius:6px;background:#fff;box-shadow:3px 3px 0 #0D0D0D}
  a.primary{background:#FF6B35}
  a:focus-visible{outline:3px solid #0D0D0D;outline-offset:3px}
</style>
</head>
<body>
<main>
  <p class="code" aria-hidden="true">4<span>0</span>4</p>
  <h1>Такой страницы нет</h1>
  <p>Возможно, ссылка устарела или в адресе опечатка. Всё о zabukai — на главной.</p>
  <div class="row">
    <a class="primary" href="/">На главную →</a>
    <a href="https://t.me/chelsnebes" rel="noopener">Написать в Telegram</a>
  </div>
</main>
</body>
</html>
